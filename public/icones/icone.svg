    <path d="M0-36c15 15 17 42 13 64h-26c-4-22-2-49 13-64z" fill="#fffbf2" stroke="#1f1b18" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="0" cy="-6" r="6.5" fill="#bcd6ee" stroke="#1f1b18" stroke-width="2.5"/>
    <path d="M-13 14-26 35-12 29zM13 14 26 35 12 29z" fill="#e0571f" stroke="#1f1b18" stroke-width="2.5" stroke-linejoin="round"/>
