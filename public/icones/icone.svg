<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- L'icône du jeu : la planète à anneau et la fusée de la couverture de pulp, sur le kraft de la carte.
       Tout tient dans le cercle central (80 %), pour les icônes « masquables » d'Android. -->
  <rect width="512" height="512" fill="#e7dcc4"/>
  <g fill="#1f1b18"><circle cx="96" cy="262" r="5"/><circle cx="400" cy="112" r="6"/><circle cx="420" cy="360" r="4.5"/><circle cx="104" cy="380" r="5"/><circle cx="250" cy="86" r="3.5"/></g>
  <ellipse cx="300" cy="300" rx="168" ry="44" transform="rotate(-18 300 300)" fill="none" stroke="#1f1b18" stroke-width="16"/>
  <ellipse cx="300" cy="300" rx="168" ry="44" transform="rotate(-18 300 300)" fill="none" stroke="#e8b86a" stroke-width="9"/>
  <circle cx="300" cy="300" r="100" fill="#9fcfca" stroke="#1f1b18" stroke-width="6"/>
  <path d="M212 262q88-36 176 0M206 300q94-32 188 0M214 338q86-30 172 0" fill="none" stroke="#5e9c97" stroke-width="11" stroke-linecap="round"/>
  <defs><clipPath id="devant"><rect x="0" y="300" width="700" height="300" transform="rotate(-18 300 300)"/></clipPath></defs>
  <g clip-path="url(#devant)">
