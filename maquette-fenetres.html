<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#e7dcc4" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet" />
    <title>Maquette des fenêtres</title>
    <!--
      Trois looks pour les fenêtres, deuxième tour (Adrien, 22/10/2026 : le premier tour faisait « trop enfantin » ; il
      veut « plus sérieux et fun à la fois »), sur la carte kraft. Données fictives. La pastille du haut fait passer d'un
      look à l'autre.
    -->
    <style>
      :root { --carte: #e7dcc4; --encre: #1f1b18; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; color: var(--encre); font-family: 'IBM Plex Mono', ui-monospace, monospace; -webkit-user-select: none; user-select: none; }
      body { background: var(--carte); }
      .carte { position: fixed; inset: 0; width: 100vw; height: 100dvh; object-fit: cover; object-position: center 46%; mix-blend-mode: multiply; }
      button { font: inherit; color: inherit; border: none; background: none; }
      #look { position: fixed; z-index: 50; top: calc(4px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 2px 10px; font: 600 10px 'IBM Plex Mono', monospace;
        letter-spacing: 0.06em; border: 1.5px dashed var(--encre); border-radius: 10px; background: var(--carte); white-space: nowrap; }

      /* Structure commune. */
      .console { position: fixed; top: calc(26px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 5; }
      .console .etat { display: flex; align-items: center; gap: 8px; padding: 7px 9px; }
      .console .ou { flex: 1; min-width: 0; }
      .console .ou b { display: block; font-size: 12px; letter-spacing: 0.04em; }
      .console .ou small { font-size: 11px; opacity: 0.75; }
      .rond { flex: none; width: 28px; height: 28px; display: grid; place-items: center; font-size: 14px; }
      .puce { flex: none; padding: 4px 8px; font-size: 11px; font-weight: 600; }
      .alerte { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 9px; font-size: 12px; }
      .alerte span { flex: 1; }
      .alerte em { font-style: normal; font-weight: 600; font-size: 11px; padding: 6px 9px; }
      .volet { position: fixed; left: 10px; right: 10px; top: 128px; bottom: 80px; z-index: 4; display: flex; flex-direction: column; overflow: hidden; }
      .volet .titre { display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 14px; }
      .volet .titre .surtitre { display: block; font-size: 9.5px; letter-spacing: 0.2em; }
      .volet .corps { flex: 1; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
      .sous { display: flex; gap: 8px; }
      .sous button { flex: 1; min-height: 44px; font-size: 12px; letter-spacing: 0.1em; }
      .contrat { position: relative; display: flex; gap: 10px; padding: 10px; }
      .tuile { flex: none; width: 52px; height: 52px; display: grid; place-items: center; font-size: 9px; font-weight: 600; text-align: center; }
      .contrat .txt { flex: 1; font-size: 11.5px; line-height: 1.4; }
      .contrat .txt b { display: block; font-size: 13px; margin-bottom: 2px; }
      .contrat .prix { font-weight: 600; font-size: 13px; white-space: nowrap; }
      .contrat .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      .contrat .actions button { min-height: 44px; padding: 0 16px; font-size: 12px; letter-spacing: 0.08em; }
      .onglets { position: fixed; left: 10px; right: 10px; bottom: calc(8px + env(safe-area-inset-bottom)); height: 60px; z-index: 5; display: flex; overflow: hidden; }
      .onglets button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; }
      .onglets i { font-style: normal; font-size: 17px; line-height: 1; }

      /* ===== 1. DOSSIER DE MISSION : les documents techniques de la NASA des années 60. Papier ivoire, filets fins,
         repères d'imprimerie aux coins, numéros de section, bandeau de classification, orange sécurité et bleu. Une
         typo condensée pour les titres, une mono technique pour les données. ===== */
      body.dossier { --papier: #faf6ec; --orange: #e0571f; --bleu: #24477a; }
      body.dossier .panneau { background: var(--papier); border: 1.5px solid var(--encre); border-radius: 2px; box-shadow: 0 1px 0 var(--encre), 4px 5px 0 rgba(31, 27, 24, 0.22); }
      body.dossier .panneau::before { content: ''; position: absolute; inset: 4px; pointer-events: none;
        background: linear-gradient(var(--encre), var(--encre)) 0 0 / 9px 1.5px no-repeat, linear-gradient(var(--encre), var(--encre)) 0 0 / 1.5px 9px no-repeat,
          linear-gradient(var(--encre), var(--encre)) 100% 100% / 9px 1.5px no-repeat, linear-gradient(var(--encre), var(--encre)) 100% 100% / 1.5px 9px no-repeat; }
      body.dossier .rond { border: 1.5px solid var(--encre); border-radius: 50%; color: var(--bleu); }
      body.dossier .puce { border: 1.5px solid var(--encre); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.06em; }
      body.dossier .puce.or { background: var(--encre); color: var(--papier); }
      body.dossier .alerte { border-top: 1.5px solid var(--encre); background: repeating-linear-gradient(-45deg, rgba(224, 87, 31, 0.13) 0 6px, transparent 6px 12px); }
      body.dossier .alerte b { color: var(--orange); }
      body.dossier .alerte em { background: var(--orange); color: #fff; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.1em; }
      body.dossier .volet .titre { border-bottom: 3px double var(--encre); margin: 0 10px; padding: 12px 4px 8px; }
      body.dossier .volet .titre h2 { font: 800 30px/0.9 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
      body.dossier .volet .titre .surtitre { color: var(--orange); font-weight: 600; }
      body.dossier .volet .titre button { font: 600 13px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; }
      body.dossier .sous button { font: 600 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; border: 1.5px solid var(--encre); }
      body.dossier .sous button.actif { background: var(--encre); color: var(--papier); }
      body.dossier .contrat { border-top: 1.5px solid var(--encre); padding: 12px 2px 10px; }
      body.dossier .contrat::before { content: attr(data-n); position: absolute; top: -9px; left: 0; padding: 0 6px 0 0; background: var(--papier); font: 700 12px 'Barlow Condensed', sans-serif; letter-spacing: 0.12em; color: var(--orange); }
      body.dossier .tuile { border: 1.5px solid var(--encre); border-radius: 50%; font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.06em; }
      body.dossier .contrat .prix { font: 700 18px 'Barlow Condensed', sans-serif; }
      body.dossier .contrat .actions button { font: 600 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; border: 1.5px solid var(--encre); }
      body.dossier .contrat .actions button.go { background: var(--orange); color: #fff; border-color: var(--orange); }
      body.dossier .onglets { font-family: 'Barlow Condensed', sans-serif; }
      body.dossier .onglets button { font-size: 12.5px; letter-spacing: 0.08em; }
      body.dossier .onglets button + button { border-left: 1px solid rgba(31, 27, 24, 0.3); }
      body.dossier .onglets button.actif { box-shadow: inset 0 -4px 0 var(--orange); font-weight: 700; }

      /* ===== 2. JAQUETTE : les pochettes de disques jazz des années 50-60 (Blue Note) et les génériques de Saul Bass.
         Aplats francs et sobres, typographie lourde et serrée, compositions décalées, une seule couleur forte par
         fenêtre. Élégant, adulte, mais avec du rythme. ===== */
      body.jaquette { --creme: #f5efe1; --noir: #161412; --accent: #e3612d; --sarcelle: #2f6f73; }
      body.jaquette .panneau { background: var(--creme); border-radius: 0; box-shadow: 6px 6px 0 var(--noir); }
      body.jaquette .console { border-left: 10px solid var(--accent); }
      body.jaquette .rond { background: var(--noir); color: var(--creme); }
      body.jaquette .puce { background: var(--noir); color: var(--creme); font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.08em; }
      body.jaquette .alerte { background: var(--noir); color: var(--creme); }
      body.jaquette .alerte b { color: var(--accent); }
      body.jaquette .alerte em { background: var(--accent); color: var(--noir); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; }
      body.jaquette .volet .titre { background: var(--sarcelle); color: var(--creme); padding: 18px 14px 10px; position: relative; overflow: hidden; }
      body.jaquette .volet .titre::after { content: ''; position: absolute; right: -30px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: var(--accent); mix-blend-mode: multiply; }
      body.jaquette .volet .titre h2 { position: relative; z-index: 1; font: 900 40px/0.85 'Big Shoulders Display', sans-serif; letter-spacing: -0.01em; text-transform: uppercase; }
      body.jaquette .volet .titre .surtitre { color: #c9dcd6; }
      body.jaquette .volet .titre button { position: relative; z-index: 1; font: 700 13px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; }
      body.jaquette .sous button { font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; background: transparent; box-shadow: inset 0 -2px 0 var(--noir); }
      body.jaquette .sous button.actif { background: var(--noir); color: var(--creme); box-shadow: none; }
      body.jaquette .contrat { background: #fff; box-shadow: 4px 4px 0 var(--noir); }
      body.jaquette .tuile { background: var(--sarcelle); color: var(--creme); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.06em; }
      body.jaquette .tuile.rouge { background: var(--accent); color: var(--noir); }
      body.jaquette .contrat .prix { font: 900 22px 'Big Shoulders Display', sans-serif; }
      body.jaquette .contrat .actions button { font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.12em; box-shadow: inset 0 0 0 2px var(--noir); }
      body.jaquette .contrat .actions button.go { background: var(--noir); color: var(--creme); }
      body.jaquette .onglets { font-family: 'Barlow Condensed', sans-serif; }
      body.jaquette .onglets button { font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em; }
      body.jaquette .onglets button.actif { background: var(--noir); color: var(--creme); }

      /* ===== 3. PANNEAU D'INSTRUMENTS : l'avionique des années 60. Fenêtres en bakélite noire mate, étiquettes
         gravées blanc sur noir, filets fins, voyants ambre, boutons à cabochon. Très sérieux, et ça se détache net de
         la carte kraft. ===== */
      body.instruments { --noir: #22201d; --gris: #34312c; --gravure: #ece4d2; --ambre: #f0a531; --vert: #7fc28a; }
      body.instruments .panneau { color: var(--gravure); background: var(--noir) linear-gradient(rgba(255, 255, 255, 0.03), transparent 40%);
        border: 1px solid #000; border-radius: 6px; box-shadow: inset 0 0 0 1px #4a463f, 0 3px 0 #000, 0 6px 12px rgba(0, 0, 0, 0.3); }
      body.instruments .rond { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ffd27a, var(--ambre) 55%, #9c5d10); color: var(--noir); box-shadow: 0 0 8px rgba(240, 165, 49, 0.55); }
      body.instruments .puce { background: var(--gris); border: 1px solid #55504a; border-radius: 3px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.08em; }
      body.instruments .alerte { border-top: 1px solid #4a463f; }
      body.instruments .alerte b { color: var(--ambre); }
      body.instruments .alerte em { border-radius: 4px; background: linear-gradient(#f3b54a, #c9801d); color: var(--noir); font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.1em; box-shadow: 0 2px 0 #000; }
      body.instruments .volet .titre { margin: 10px 12px 0; padding: 8px 12px; border: 1px solid #55504a; border-radius: 3px; background: var(--gris); }
      body.instruments .volet .titre h2 { font: 700 24px 'Barlow Condensed', sans-serif; letter-spacing: 0.32em; text-transform: uppercase; }
      body.instruments .volet .titre .surtitre { color: var(--ambre); }
      body.instruments .volet .titre button { font: 600 13px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; color: #b8b0a0; }
      body.instruments .sous button { font: 600 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.16em; border-radius: 4px; background: var(--gris); border: 1px solid #55504a; box-shadow: 0 2px 0 #000; }
      body.instruments .sous button.actif { color: var(--ambre); box-shadow: inset 0 2px 4px #000; text-shadow: 0 0 6px rgba(240, 165, 49, 0.6); }
      body.instruments .contrat { border: 1px solid #4a463f; border-radius: 4px; background: rgba(255, 255, 255, 0.03); }
      body.instruments .tuile { border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3f4b3f, #232a23); border: 1px solid #000; color: var(--vert); font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 0.06em; box-shadow: inset 0 0 6px rgba(127, 194, 138, 0.35); }
      body.instruments .tuile.rouge { color: #f08a72; background: radial-gradient(circle at 40% 35%, #4b3a36, #2a201e); box-shadow: inset 0 0 6px rgba(240, 138, 114, 0.35); }
      body.instruments .contrat .prix { font: 700 18px 'Barlow Condensed', sans-serif; color: var(--ambre); }
      body.instruments .contrat .actions button { font: 600 15px 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; border-radius: 4px; background: var(--gris); border: 1px solid #55504a; box-shadow: 0 2px 0 #000; }
      body.instruments .contrat .actions button.go { background: linear-gradient(#f3b54a, #c9801d); color: var(--noir); border-color: #000; }
      body.instruments .onglets { font-family: 'Barlow Condensed', sans-serif; }
      body.instruments .onglets button { font-size: 12.5px; letter-spacing: 0.1em; color: #b8b0a0; }
      body.instruments .onglets button.actif { color: var(--ambre); text-shadow: 0 0 6px rgba(240, 165, 49, 0.6); box-shadow: inset 0 -3px 0 var(--ambre); }

      .panneau { position: fixed; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body class="dossier">
    <img class="carte" src="./maquette/carte-repos.png" alt="" />
    <button type="button" id="look">LOOK 1/3 · DOSSIER DE MISSION ›</button>

    <div class="console panneau">
      <div class="etat"><span class="rond">◎</span><div class="ou"><b>EN ORBITE · TERRE</b><small>400 km · un tour en 1 h 32</small></div><span class="puce">NIV 3</span><span class="puce or">1 240 CR</span></div>
      <div class="alerte"><span><b>PANNE · MOTEUR</b> vitesse ÷ 2</span><em>RÉPARER</em></div>
    </div>

    <div class="volet panneau">
      <div class="titre"><div><span class="surtitre">CARNET DE BORD · 03</span><h2>Journal</h2></div><button type="button">FERMER</button></div>
      <div class="corps">
        <div class="sous"><button type="button">QUÊTES</button><button type="button" class="actif">CONTRATS</button></div>
        <div class="contrat" data-n="C-01"><span class="tuile">VIDER</span><div class="txt"><b>Vider l'épave Envisat</b>poste de tri · 3 min · ●○○
          <div class="actions"><button type="button">VOIR</button><button type="button" class="go">ACCEPTER</button></div></div><span class="prix">90</span></div>
        <div class="contrat" data-n="C-02"><span class="tuile rouge">ESCORTER</span><div class="txt"><b>Escorter un convoi de Tiangong à Terra</b>tourelle · 12 min · ●●○
          <div class="actions"><button type="button">VOIR</button><button type="button" class="go">ACCEPTER</button></div></div><span class="prix">130</span></div>
      </div>
    </div>

    <nav class="onglets panneau">
      <button type="button"><i>⌂</i>CAPSULE</button><button type="button" class="actif"><i>☰</i>JOURNAL</button><button type="button"><i>↗</i>MARCHÉ</button><button type="button"><i>▤</i>COLLECT.</button><button type="button"><i>⋯</i>PLUS</button>
    </nav>

    <script>
      const LOOKS = [['dossier', 'DOSSIER DE MISSION'], ['jaquette', 'JAQUETTE'], ['instruments', 'PANNEAU D\'INSTRUMENTS']]
      let n = Math.max(0, LOOKS.findIndex(([k]) => k === new URLSearchParams(location.search).get('look')))
      const afficher = () => { document.body.className = LOOKS[n][0]; document.querySelector('#look').textContent = `LOOK ${n + 1}/3 · ${LOOKS[n][1]} ›` }
      document.querySelector('#look').onclick = () => { n = (n + 1) % LOOKS.length; afficher() }
      afficher()
    </script>
  </body>
</html>
