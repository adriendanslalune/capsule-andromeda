<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22/%3E%3C/svg%3E" />
    <title>Capsule Andromeda</title>
  </head>
  <body>
    <canvas id="plan"></canvas>
    <div id="infos"></div>
    <div id="haut">
      <div id="bandeau"></div>
      <div id="titre-carte"><button id="bouton-retour" type="button" hidden>‹ Système solaire</button><div id="titre"></div><button id="bouton-capsule" type="button" aria-label="Aller à la capsule">◎ Capsule</button></div>
      <div id="rangee-messages"><button id="bulle-message" type="button" hidden></button><button id="bouton-messages" type="button" aria-label="Messages"><svg class="picto-messages" viewBox="0 0 40 40" aria-hidden="true"><path class="ondes" d="M29 7.5a6 6 0 0 1 4.5 4.5M30 3.5a10 10 0 0 1 8 8"/><path class="bulle-b" d="M16 17h17a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-3l1 5-6-5h-9a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z"/><path class="bulle-a" d="M6 8h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-6 5 1-5h-2a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z"/><path class="antenne" d="M22 8l4-3.5"/><circle class="antenne-bout" cx="26.5" cy="4.2" r="1.6"/><path class="texte" d="M8 13h12M8 17h8"/><circle class="point" cx="22" cy="25" r="1.3"/><circle class="point" cx="26" cy="25" r="1.3"/><circle class="point" cx="30" cy="25" r="1.3"/></svg><span class="pastille" hidden></span></button></div>
    </div>
    <div id="message" hidden></div>
    <div id="trajet" hidden><div id="trajet-texte"></div><button id="bouton-depart" type="button" hidden>DÉPART</button></div>
    <div id="volet" hidden>
      <div class="entete"><span id="volet-titre"></span><button type="button" id="volet-fermer">Fermer</button></div>
      <div class="page" data-contenu="navigation" id="cadran"></div>
      <div class="page" data-contenu="capsule" hidden>
        <div class="sous-onglets"><button type="button" data-sous="etat" class="actif">ÉTAT</button><button type="button" data-sous="soute">SOUTE</button><button type="button" data-sous="armement">ARMEMENT</button><button type="button" data-sous="reparation">RÉPARATION</button></div>
        <div id="capsule"></div>
        <div id="soute" hidden></div>
        <div id="armement" hidden></div>
        <div id="reparation" hidden>
          <div class="barre-reparation"><span id="etat-reparation"></span><button type="button" data-choix="manuel">📖 MANUEL</button></div>
          <div id="panneau"></div>
          <div id="commandes" class="commandes" hidden></div>
        </div>
      </div>
      <div class="page" data-contenu="manuel" id="manuel" hidden></div>
      <div class="page" data-contenu="profil" id="profil" hidden></div>
      <div class="page" data-contenu="messages" id="messages" hidden></div>
      <div class="page" data-contenu="missions" id="missions" hidden></div>
      <div class="page" data-contenu="marche" id="marche" hidden></div>
      <div class="page" data-contenu="plus" hidden>
        <button type="button" class="rubrique" data-page="messages">Messages <span class="pastille-rubrique" hidden></span>›</button>
        <button type="button" class="rubrique" data-page="profil">Profil ›</button>
        <button type="button" class="rubrique" data-page="manuel">Manuel ›</button>
        <button type="button" class="rubrique" data-page="reglages">Réglages ›</button>
      </div>
      <div class="page" data-contenu="reglages" id="reglages" hidden>
        <button type="button" class="retour" data-page="plus">‹ Plus</button>
        <div class="groupe">Destination :
          <label><input type="checkbox" data-reglage="crochet" /> Crochet</label>
          <label><input type="checkbox" data-reglage="etiquette" /> Étiquette (nom, distance)</label>
          <label><input type="checkbox" data-reglage="fleche" /> Flèche hors champ</label>
        </div>
        <label><input type="checkbox" data-reglage="orbites" /> Orbites</label>
        <label><input type="checkbox" data-reglage="noms" /> Noms</label>
        <label><input type="checkbox" data-reglage="nuit" /> Mode nuit</label>
        <div class="groupe essais">Essais — accélérer le temps :
          <div class="choix">
            <label><input type="radio" name="acceleration" value="1" /> ×1</label>
            <label><input type="radio" name="acceleration" value="60" /> 1 min/s</label>
            <label><input type="radio" name="acceleration" value="3600" /> 1 h/s</label>
            <label><input type="radio" name="acceleration" value="86400" /> 1 j/s</label>
            <label><input type="radio" name="acceleration" value="2592000" /> 1 mois/s</label>
          </div>
          <label><input type="checkbox" data-reglage="forcerVitesse" /> Forcer la vitesse (au lieu du moteur)</label>
          Vitesse forcée : <span id="texte-budget"></span>
          <input id="budget" type="range" min="0" max="100" step="1" />
        </div>
        <button type="button" id="provoquer-panne">Provoquer une panne au hasard (essai)</button>
        <button type="button" id="recommencer">Recommencer à zéro…</button>
      </div>
    </div>
    <nav id="onglets">
      <button type="button" data-onglet="navigation">Navigation</button>
      <button type="button" data-onglet="capsule">Capsule</button>
      <button type="button" data-onglet="missions">Missions</button>
      <button type="button" data-onglet="marche">Marché</button>
      <button type="button" data-onglet="plus">Plus<span class="pastille-onglet" hidden></span></button>
    </nav>
    <div id="combat" class="plein" hidden></div>
    <div id="tri" class="plein" hidden></div>
    <div id="fenetre" class="fenetre" hidden></div>
    <div id="paysage">Tiens ton téléphone à la verticale.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
